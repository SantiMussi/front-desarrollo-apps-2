sonar.sources=.
sonar.tests=e2e
sonar.exclusions=src/**/__tests__/**,src/test/**,src/**/*.test.*,src/**/*.spec.*,e2e/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Playwright configuration and integration runners execute outside Vitest.
# The static Analytics script runs in the browser and is exercised by
# e2e/real/security-headers.e2e.js. Keep it in static analysis.
sonar.coverage.exclusions=scripts/**,playwright.config.js,playwright.real.config.js,public/analytics-init.js
sonar.sourceEncoding=UTF-8
