sonar.exclusions=src/**/__tests__/**,src/test/**,src/**/*.test.*,src/**/*.spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Playwright specs, configs, and integration runners execute outside Vitest.
# Keep these files in static analysis and exclude only their coverage.
sonar.coverage.exclusions=scripts/**,e2e/real/tickets.e2e.js,playwright.config.js,playwright.real.config.js
sonar.sourceEncoding=UTF-8
