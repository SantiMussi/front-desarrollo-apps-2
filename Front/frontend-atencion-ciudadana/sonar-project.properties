sonar.exclusions=src/**/__tests__/**,src/test/**,src/**/*.test.*,src/**/*.spec.*
# Analyze the Playwright suites, helpers, and configuration as test code.
sonar.tests=e2e,playwright.config.js,playwright.real.config.js
sonar.test.inclusions=e2e/**/*.js,playwright.config.js,playwright.real.config.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Integration runners execute outside Vitest and remain subject to static analysis.
sonar.coverage.exclusions=scripts/**
sonar.sourceEncoding=UTF-8
