# Port 80 is ordinary HTTP (including local development): ignore proxy headers.
# Port 8082 is exclusively Caddy's private Docker upstream; NEVER publish it.
# Caddy overwrites these headers from the actual connection at the public edge.
map $server_port $original_scheme {
    default $scheme;
    8082 https;
}
map $server_port $original_port {
    default $server_port;
    8082 443;
}
map $server_port $original_client {
    default $remote_addr;
    8082 $http_x_forwarded_for;
}

# Tracking anónimo (DDA2-197): límite de intentos por IP real. Cada
# POST /api/tracking/** acredita con código + contraseña, así que todos cuentan
# como intento. Las descargas de contenido de adjuntos (previsualizaciones, varias
# en paralelo) van a otra zona más holgada para no frenar la navegación normal.
# Clave vacía = sin límite (p. ej. 8082 sin X-Forwarded-For, nunca desde Caddy).
map $uri $tracking_limit_key {
    default "";
    ~*^/api/tracking/actions/attachments/[^/]+/content$ "";
    ~*^/api/tracking/ $original_client;
}
map $uri $tracking_files_limit_key {
    default "";
    ~*^/api/tracking/actions/attachments/[^/]+/content$ $original_client;
}
limit_req_zone $tracking_limit_key zone=tracking:10m rate=12r/m;
limit_req_zone $tracking_files_limit_key zone=tracking_files:10m rate=60r/m;

server {
    listen 80;
    listen 8082;
    server_name _;
    # Also covers Nginx-generated directory redirects behind TLS termination.
    absolute_redirect off;

    # Match Spring's 55MB multipart request cap: 50 MiB of files plus
    # 5 MiB for JSON parts, boundaries and other multipart overhead.
    client_max_body_size 55m;

    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        # Relative redirect preserves origin and 308 preserves method/body.
        return 308 /api/$is_args$args;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $original_client;
        proxy_set_header X-Forwarded-For $original_client;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $original_port;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";

        # Sólo cuenta para /api/tracking/** (ver maps arriba); el resto de /api/ no se limita.
        limit_req zone=tracking burst=8 nodelay;
        limit_req zone=tracking_files burst=30 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @rate_limited;
    }

    # Respuesta uniforme: no distingue código válido de inválido.
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":"TOO_MANY_ATTEMPTS","message":"Demasiados intentos. Esperá un minuto y volvé a intentar."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
