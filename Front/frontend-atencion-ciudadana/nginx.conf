# Port 80 is ordinary HTTP (including local development): ignore proxy headers.
# Port 8082 is exclusively Caddy's private Docker upstream; NEVER publish it.
# Caddy overwrites these headers from the actual connection at the public edge.
map $server_port $original_scheme {
    default $scheme;
    8082 https;
}
map $server_port $original_port {
    default $server_port;
    8082 443;
}
map $server_port $original_client {
    default $remote_addr;
    8082 $http_x_forwarded_for;
}

# Tracking anónimo (DDA2-197): límite de intentos por IP real. Cada
# POST /api/tracking/** acredita con código + contraseña, así que todos cuentan
# como intento. Las descargas de contenido de adjuntos (previsualizaciones, varias
# en paralelo) van a otra zona más holgada para no frenar la navegación normal.
# Clave vacía = sin límite (p. ej. 8082 sin X-Forwarded-For, nunca desde Caddy).
map $uri $tracking_limit_key {
    default "";
    ~*^/api/tracking/actions/attachments/[^/]+/content$ "";
    ~*^/api/tracking/ $original_client;
}
map $uri $tracking_files_limit_key {
    default "";
    ~*^/api/tracking/actions/attachments/[^/]+/content$ $original_client;
}
limit_req_zone $tracking_limit_key zone=tracking:10m rate=12r/m;
limit_req_zone $tracking_files_limit_key zone=tracking_files:10m rate=60r/m;

server {
    listen 80;
    listen 8082;
    server_name _;
    # Also covers Nginx-generated directory redirects behind TLS termination.
    absolute_redirect off;

    # Match Spring's 55MB multipart request cap: 50 MiB of files plus
    # 5 MiB for JSON parts, boundaries and other multipart overhead.
    client_max_body_size 55m;

    root /usr/share/nginx/html;
    index index.html;

    # La CSP del portal y el 429 conservan las cabeceras del servidor.
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api {
        # Relative redirect preserves origin and 308 preserves method/body.
        return 308 /api/$is_args$args;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        # El ingreso HTTPS de Caddy define HSTS; este listener también sirve HTTP local.
        proxy_hide_header Strict-Transport-Security;
        # Estas tres cabeceras ya salen del server{} de arriba y se heredan a /api/; el backend manda las suyas
        # y la respuesta salia duplicada (Referrer-Policy incluso con dos valores distintos). Rige la del borde.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $original_client;
        proxy_set_header X-Forwarded-For $original_client;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $original_port;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";

        # Sólo cuenta para /api/tracking/** (ver maps arriba); el resto de /api/ no se limita.
        limit_req zone=tracking burst=8 nodelay;
        limit_req zone=tracking_files burst=30 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @rate_limited;
    }

    # Respuesta uniforme: no distingue código válido de inválido.
    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Demasiados intentos. Esperá un minuto y volvé a intentar.","code":"TOO_MANY_ATTEMPTS","message":"Demasiados intentos. Esperá un minuto y volvé a intentar."}';
    }

    location / {
        # popLayout de Motion inserta hojas de estilo dinámicas en la bandeja.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com https://cdnjs.cloudflare.com https://raw.githubusercontent.com https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://nominatim.openstreetmap.org https://www.googletagmanager.com https://*.google-analytics.com https://www.google.com; frame-src blob: https://www.openstreetmap.org; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
