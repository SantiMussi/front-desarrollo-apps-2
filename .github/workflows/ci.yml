name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      identity_provider:
        description: "MOCK validates only. M1 publishes a separate image from dev/main; never deploys."
        type: choice
        required: true
        default: MOCK
        options:
          - MOCK
          - M1

permissions:
  contents: read

jobs:
  configuration:
    name: Resolve provider and validate CD contracts
    runs-on: ubuntu-latest
    outputs:
      identity_provider: ${{ steps.mode.outputs.identity_provider }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test CD contracts without remote access
        run: python3 -m unittest discover -s .github/tests -v
      - name: Resolve identity provider
        id: mode
        env:
          CD_IDENTITY_PROVIDER: ${{ vars.CD_IDENTITY_PROVIDER }}
          INPUT_IDENTITY_PROVIDER: ${{ inputs.identity_provider }}
        run: bash .github/scripts/resolve-provider.sh

  validate:
    name: Lint, tests, coverage and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: configuration
    env:
      TZ: UTC
      BUILD_IDENTITY_PROVIDER: ${{ needs.configuration.outputs.identity_provider }}
    concurrency:
      group: ${{ github.workflow }}-validate-${{ github.event.pull_request.number || github.ref }}-${{ needs.configuration.outputs.identity_provider }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: Front/frontend-atencion-ciudadana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check explicit M1 publication branch
        if: github.event_name == 'workflow_dispatch' && inputs.identity_provider == 'M1'
        run: |
          if [[ "$GITHUB_REF" != refs/heads/dev && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "M1 publication requires dev or main." >&2
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front/frontend-atencion-ciudadana/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build application
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_IDENTITY_PROVIDER: ${{ env.BUILD_IDENTITY_PROVIDER }}

      - name: Validate Nginx proxy configuration
        run: |
          docker run --rm --network none \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine nginx -t

      - name: Build Frontend container image
        if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
        run: docker build --build-arg VITE_API_BASE_URL=/api --build-arg VITE_IDENTITY_PROVIDER="$BUILD_IDENTITY_PROVIDER" --tag frontend-ci:${{ github.sha }} .

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: configuration
    env:
      TZ: UTC
      # Existing E2E emulate the MOCK API; validate builds the selected provider.
      VITE_IDENTITY_PROVIDER: MOCK
      VITE_API_BASE_URL: /api
    concurrency:
      group: ${{ github.workflow }}-e2e-${{ github.event.pull_request.number || github.ref }}-${{ needs.configuration.outputs.identity_provider }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: Front/frontend-atencion-ciudadana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front/frontend-atencion-ciudadana/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Corre los escenarios sobre la app compilada con el Chrome del runner.
      # La API está mockeada en cada escenario, así que no depende del back.
      - name: Run E2E scenarios
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Front/frontend-atencion-ciudadana/playwright-report
          retention-days: 7

  publish:
    name: Publish Frontend image
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.identity_provider == 'M1' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    needs: [configuration, validate, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_IDENTITY_PROVIDER: ${{ needs.configuration.outputs.identity_provider }}
      IMAGE_REPOSITORY: ghcr.io/santimussi/front-desarrollo-apps-2
    outputs:
      image: ${{ steps.record.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && 'frontend-m1-publish' || 'frontend-dev-publish' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tags
        id: image
        shell: bash
        run: |
          if [[ "$BUILD_IDENTITY_PROVIDER" == M1 ]]; then
            # A dispatch/rerun never replaces MOCK tags or an earlier M1 build.
            reference="$IMAGE_REPOSITORY:m1-sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            printf 'tags=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          else
            reference="$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
            printf 'tags<<FRONTEND_TAGS\n%s:dev\n%s\nFRONTEND_TAGS\n' "$IMAGE_REPOSITORY" "$reference" >> "$GITHUB_OUTPUT"
          fi
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"

      - name: Build and publish Frontend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: Front/frontend-atencion-ciudadana
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_IDENTITY_PROVIDER=${{ env.BUILD_IDENTITY_PROVIDER }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ar.edu.uade.m2.identity-provider=${{ env.BUILD_IDENTITY_PROVIDER }}

      - name: Record published image and digest
        id: record
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing image digest." >&2; exit 1; }
          printf 'image=%s@%s\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          {
            printf '### Frontend %s\n\n' "$BUILD_IDENTITY_PROVIDER"
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Image tag: `%s`\n' "$IMAGE_REFERENCE"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- Immutable reference for Infra: `%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST"
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              printf '\nManual publication only; this run never deploys.\n'
            else
              printf '\nCD uses this digest only when CD_ENABLED=true; Infra verifies the live Backend provider.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Frontend to Lightsail
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.CD_ENABLED == 'true'
    needs: [configuration, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lightsail-dev-frontend-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout deployment guards
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Refuse stale dev runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')"
          [[ "$current_sha" == "$GITHUB_SHA" ]] || { echo 'Stale dev run; no deployment allowed.' >&2; exit 65; }

      - name: Validate selected CD image and provider
        env:
          SELECTED_PROVIDER: ${{ needs.configuration.outputs.identity_provider }}
          CONFIGURED_CD_PROVIDER: ${{ vars.CD_IDENTITY_PROVIDER }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
        shell: bash
        run: |
          [[ "$SELECTED_PROVIDER" == M1 || "$SELECTED_PROVIDER" == MOCK ]]
          [[ "$SELECTED_PROVIDER" == "$CONFIGURED_CD_PROVIDER" ]] || { echo 'Selected provider differs from configured CD provider.' >&2; exit 65; }
          [[ "$DEPLOY_IMAGE" =~ ^ghcr\.io/santimussi/front-desarrollo-apps-2@sha256:[0-9a-f]{64}$ ]]

      - name: Configure SSH
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        shell: bash
        run: |
          : "${LIGHTSAIL_SSH_PRIVATE_KEY:?LIGHTSAIL_SSH_PRIVATE_KEY is required}"
          : "${LIGHTSAIL_KNOWN_HOSTS:?LIGHTSAIL_KNOWN_HOSTS is required}"
          umask 077
          printf '%s\n' "$LIGHTSAIL_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lightsail_cd"
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$RUNNER_TEMP/lightsail_known_hosts"
          chmod 600 "$RUNNER_TEMP/lightsail_cd" "$RUNNER_TEMP/lightsail_known_hosts"

      - name: Deploy published Frontend digest
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER }}
          LIGHTSAIL_DEPLOY_PATH: ${{ vars.LIGHTSAIL_DEPLOY_PATH }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
          CD_PROVIDER: ${{ needs.configuration.outputs.identity_provider }}
        shell: bash
        run: |
          : "${LIGHTSAIL_HOST:?LIGHTSAIL_HOST is required}"
          : "${LIGHTSAIL_USER:?LIGHTSAIL_USER is required}"
          : "${LIGHTSAIL_DEPLOY_PATH:?LIGHTSAIL_DEPLOY_PATH is required}"
          [[ "$LIGHTSAIL_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$LIGHTSAIL_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$LIGHTSAIL_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          ssh \
            -i "$RUNNER_TEMP/lightsail_cd" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/lightsail_known_hosts" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "bash -s -- '$LIGHTSAIL_DEPLOY_PATH' frontend '$DEPLOY_IMAGE' '$CD_PROVIDER'" \
            < .github/scripts/deploy-cd.sh

      - name: Remove temporary SSH files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lightsail_cd" "$RUNNER_TEMP/lightsail_known_hosts"
